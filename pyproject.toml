[project]
name = "catbowl"
version = "0.1.0"
description = "Per-cat feeding station: recognise the cat at each bowl and lift only its lid"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "PyYAML>=6.0",
    "scikit-learn>=1.3",
    "joblib>=1.3",
]

[project.optional-dependencies]
torch = ["torch>=2.2", "torchvision>=0.17"]
pi = ["smbus2>=0.4", "pigpio>=1.78"]
dev = ["pytest>=7.0"]

[project.scripts]
catbowl = "catbowl.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["catbowl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
