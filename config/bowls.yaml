# catbowl configuration
# ---------------------
# Every value the rig needs. Change it and restart: `sudo systemctl restart catbowl`.

recognition:
  backend: torch                 # torch | tflite | mock
  model: mobilenet_v3_small      # frozen ImageNet backbone used as a feature extractor
  classifier: models/classifier.joblib
  input_size: 224
  # Below this confidence a frame counts as "unknown" and no lid moves.
  # `catbowl train` prints a suggested value - start there.
  min_confidence: 0.85
  # A lid only moves when votes_required of the last vote_window frames agree.
  # At loop_fps: 5 this means ~0.8s of consistent evidence.
  vote_window: 6
  votes_required: 4

detector:
  # hybrid = motion triggers, ssdlite confirms it is actually a cat.
  # This gate matters: the classifier only knows your cats, so shown a dog or a
  # hand it still returns one of them, sometimes confidently. Something has to
  # establish "a cat is here" before "which cat" is a sensible question.
  #   hybrid  - selective, and cheap because ssdlite runs only on arrival
  #   motion  - cheapest, but fires on anything that moves
  #   ssdlite - most selective, runs the detector on every frame (slow on a Pi)
  #   none    - whole frame, for a camera that only ever sees the bowl
  type: hybrid
  min_area_frac: 0.02            # ignore blobs smaller than 2% of the frame
  pad_frac: 0.15
  warmup_frames: 30              # frames spent learning the empty scene at startup
  score_threshold: 0.5           # how sure ssdlite must be that it is a cat
  confirm_every_s: 2.0           # how often ssdlite is re-asked during a visit
  reject_backoff_s: 1.0          # how long a "not a cat" suppresses re-checking
  # A cat eating has its face in the bowl and does not look like a cat to a
  # COCO detector for minutes at a time. These two keep a visit alive through
  # that: ssdlite must refuse for confirm_grace_s straight, and motion must be
  # absent for visit_gap_s, before the cat counts as gone.
  confirm_grace_s: 25.0
  visit_gap_s: 2.0

actuator:
  driver: pca9685                # pca9685 | gpio | mock
  i2c_address: 0x40
  frequency: 50
  move_speed_deg_s: 90           # slew limit. Lower = gentler lid, and safer round cats
  step_deg: 3
  min_pulse_us: 500              # MG996R; check your servo's datasheet
  max_pulse_us: 2500

loop_fps: 5                      # per-bowl inference rate. 5 is comfortable on a Pi 4
status_port: 8080                # http://<pi>:8080/ - set to null to disable
log_dir: logs
snapshot_dir: null               # set a path (or use `run --collect`) to bank retraining data

# Bank a photo every time the detector finds something at a bowl, so a training
# set builds itself while the rig runs. They land unsorted in <dir>/unsorted:
# the rig cannot know which cat it is looking at until a classifier exists, and
# labelling them by guess would poison the dataset. Sort them into per-cat
# folders by hand (data/crops/mochi/, ...) and run `catbowl train`.
capture:
  dir: data/collected        # null, or `run --no-capture`, turns this off
  interval_s: 2.0            # seconds between saved images, per bowl
  max_images: 5000           # stop before the SD card does
  save_frame: false          # true also keeps the whole frame beside each crop
  # Buckets offered by the sorting page at http://<pi>:8080/sort. Each is a
  # folder under `dir`. M is "more than one cat": no use for training a
  # single-cat classifier, but kept rather than thrown away.
  labels: [J, K, F]

# Applied to every bowl, then overridden per bowl below.
bowl_defaults:
  camera:
    width: 640
    height: 480
    fps: 10
  servo:
    closed_deg: 10
    open_deg: 95
    # Keep the PWM running so the servos hold their commanded angle. Cutting
    # drive leaves the horn limp, and anything loading it - the lid's weight,
    # or a mirrored pair pulling against each other - then drags it off
    # position after the move has finished. Set this true only if the closed
    # position is self-supporting (lid resting on the rim, not held by torque);
    # it costs some buzzing, warm servos and a constant draw on the 5 V supply.
    detach_when_idle: false
  policy:
    open_confirm_s: 0.8          # the right cat must be seen this long before the lid lifts
    # Agreeing frames needed to open, which is deliberately a lower bar than
    # recognition.votes_required (the bar for every other transition). A cat
    # walking up has no history, and making it wait for a consensus costs it
    # seconds at the bowl in exchange for protection that near-identical
    # consecutive frames cannot really give - a hard frame errs the same way
    # twice. A wrong open is caught by the intruder rule a moment later and
    # costs the wrong cat a mouthful; a slow open costs the right cat its meal
    # every time. The owner still cannot open its lid while another cat is
    # better represented in the window.
    open_votes: 1
    close_delay_s: 25            # bowl must look empty this long before the lid drops
    # A sitting is capped at 30 seconds, then the lid drops whether or not the
    # cat is still there. This is the portioning rule: it breaks a meal into
    # portions, which slows the cats down. The bowl then goes through the normal
    # cooldown and opens again once a cat is detected and confirmed afresh.
    max_open_s: 30
    close_on_intruder: true
    intruder_grace_s: 2.0
    cooldown_s: 3.0
    # A limp servo (detach_when_idle: true) can be pawed open while the bowl is
    # shut. Re-send "closed" this often while the lid should be down, so a pushed
    # lid goes back. It returns at the servo's full speed, not the slew limit.
    # Does nothing for a servo that holds. 0 turns it off.
    reassert_closed_s: 5.0

bowls:
  # One bowl, three cats, until there is hardware for more. The bowl opens for
  # any of them, but J and F are on an allowance: one minute of open lid each
  # per rolling hour, spent across as many visits as they like. K has no entry
  # in `rations`, so she eats whenever she walks up.
  #
  # The allowance is a budget rather than one meal an hour on purpose: a cat
  # startled away after ten seconds keeps the rest and can come back for it.
  # Time is charged while the lid is open, including the close_delay it stays
  # up behind a cat that has wandered off.
  #
  # bowl1's lid is a cardboard disc lying flat on the bowl, swung sideways by
  # one servo glued to the bowl's side. Calibrate: `catbowl calibrate --bowl bowl1`.
  #
  # detach_when_idle: a held servo on a flexible mount hunts - nudge the lid and
  # it pushes back, the mount flexes, it overshoots, and it buzzes without end.
  # A disc turning flat stays where it is left, so the servo can go limp once it
  # arrives. The price: a limp lid can be pawed open, which reassert_closed_s
  # covers. Now that the servo is glued rather than taped, this can go back to
  # false, which holds the lid shut.
  - id: bowl1
    cats: [K, J, F]
    rations:
      J: 60         # seconds of open lid per hour. `J: {seconds: 60, per_s: 3600}` in full
      F: 60
    camera: {device: 0}
    servo: {channel: 1, closed_deg: 170, open_deg: 85, detach_when_idle: true}

  # Placeholders for bowls that do not exist yet. The names are ignored while
  # `enabled: false`; give them real cats when the hardware is built.
  - id: bowl2
    cat: pepper
    enabled: false
    camera: {device: 2}
    servo: {channel: 2}

  - id: bowl3
    cat: biscuit
    enabled: false
    camera: {device: 4}
    servo: {channel: 3}

# ---------------------------------------------------------------------------
# Single-camera alternative
# ---------------------------------------------------------------------------
# One wide-angle camera above all three bowls. The bowls share the device (it is
# opened once) and each takes its own slice of the frame via `roi: [x, y, w, h]`
# in fractions of the frame. Place the bowls far enough apart that the slices do
# not overlap, or a cat at bowl 2 will be judged by bowl 1's camera as well.
#
# bowls:
#   - {id: bowl1, cat: mochi,   camera: {device: 0, width: 1280, height: 720, roi: [0.00, 0.2, 0.34, 0.8]}, servo: {channel: 0}}
#   - {id: bowl2, cat: pepper,  camera: {device: 0, width: 1280, height: 720, roi: [0.33, 0.2, 0.34, 0.8]}, servo: {channel: 1}}
#   - {id: bowl3, cat: biscuit, camera: {device: 0, width: 1280, height: 720, roi: [0.66, 0.2, 0.34, 0.8]}, servo: {channel: 2}}
