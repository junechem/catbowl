# Wi-Fi power saving off for every connection. The Pi's brcmfmac chip stays
# associated with power save on but stops answering for stretches, which is
# how rjwpi.local kept vanishing from the network (2026-09-14). NetworkManager
# leaves it to the driver by default, and the driver turns it on.
# Installed as /etc/NetworkManager/conf.d/wifi-powersave-off.conf.
[connection]
wifi.powersave = 2
