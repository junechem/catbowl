# Keep the system journal on disk. Raspberry Pi OS ships
# /usr/lib/systemd/journald.conf.d/40-rpi-volatile-storage.conf with
# Storage=volatile to spare the SD card, which means every reboot erases the
# log of whatever caused it. Found 2026-09-14, after two crashes left nothing.
# Installed as /etc/systemd/journald.conf.d/90-keep-logs.conf.
[Journal]
Storage=persistent
SystemMaxUse=200M
